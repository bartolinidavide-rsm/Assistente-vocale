<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Visivo AI</title>
  <!-- TensorFlow.js e Modello di Rilevamento COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #FFFF00; /* Giallo ad alto contrasto */
      --accent-color: #00FFFF; /* Ciano per stato e pulsanti */
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #111;
      border-bottom: 3px solid var(--accent-color);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    #status {
      font-size: 1.2rem;
      margin-top: 5px;
      color: var(--accent-color);
      font-weight: bold;
    }

    .view-container {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #111;
      border-top: 3px solid var(--accent-color);
    }

    button {
      background-color: var(--text-color);
      color: #000;
      border: none;
      padding: 22px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(255, 255, 0, 0.4);
    }

    button:active {
      transform: scale(0.98);
      background-color: var(--accent-color);
    }

    #log {
      max-height: 70px;
      overflow-y: auto;
      font-size: 1.1rem;
      color: #FFF;
      padding: 8px;
      background: #222;
      border-radius: 6px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Assistente Visivo AI</h1>
    <div id="status" aria-live="polite">Sistema in attesa</div>
  </header>

  <div class="view-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="toggleAssistant()">AVVIA ASSISTENTE</button>
    <div id="log" aria-live="assertive">Premere il pulsante per iniziare.</div>
  </div>

  <script>
    let model;
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('output');
    let ctx = canvas.getContext('2d');
    let statusDiv = document.getElementById('status');
    let logDiv = document.getElementById('log');
    let startBtn = document.getElementById('startBtn');

    let isRunning = false;
    let lastAnnouncedTime = 0;
    let lastAnnouncedObject = "";
    const ANNOUNCE_COOLDOWN = 3000; // Millisecondi di attesa prima di ripetere

    // Traduzione e mappatura delle etichette del modello
    const labelTranslations = {
      "person": "persona",
      "chair": "sedia",
      "couch": "divano",
      "potted plant": "pianta",
      "bed": "letto",
      "dining table": "tavolo",
      "tv": "televisione",
      "laptop": "computer",
      "cell phone": "telefono",
      "book": "libro",
      "bottle": "bottiglia",
      "cup": "tazza",
      "door": "porta",
      "stair": "gradino",
      "car": "automobile",
      "bicycle": "bicicletta",
      "motorcycle": "motocicletta",
      "backpack": "zaino",
      "cat": "gatto",
      "dog": "cane"
    };

    // Sintesi vocale (TTS)
    function speak(text, priority = false) {
      if (!('speechSynthesis' in window)) return;
      
      if (priority) {
        window.speechSynthesis.cancel(); // Interrompe frasi in corso per messaggi urgenti
      } else if (window.speechSynthesis.speaking) {
        return; // Evita sovrapposizioni
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'it-IT';
      utterance.rate = 1.05; // Velocità di lettura
      window.speechSynthesis.speak(utterance);
      
      logDiv.innerText = text;
    }

    // Feedback tattile (vibrazione)
    function triggerVibration(pattern = [100]) {
      if (navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    }

    async function toggleAssistant() {
      if (isRunning) {
        stopAssistant();
      } else {
        await startAssistant();
      }
    }

    async function startAssistant() {
      speak("Caricamento del sistema in corso. Attendere.", true);
      statusDiv.innerText = "Caricamento IA...";
      startBtn.innerText = "CARICAMENTO...";

      try {
        if (!model) {
          model = await cocoSsd.load();
        }

        // Richiede la fotocamera posteriore dello smartphone
        const constraints = {
          video: { facingMode: { exact: "environment" } },
          audio: false
        };

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (e) {
          // Fallback a qualsiasi fotocamera disponibile
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          isRunning = true;
          startBtn.innerText = "ARRESTA ASSISTENTE";
          statusDiv.innerText = "Monitoraggio Attivo";
          speak("Fotocamera attiva. Monitoraggio avviato.");
          detectFrame();
        };

      } catch (err) {
        console.error(err);
        statusDiv.innerText = "Errore Fotocamera";
        speak("Impossibile accedere alla fotocamera. Verifica i permessi.", true);
        startBtn.innerText = "RIPROVA";
      }
    }

    function stopAssistant() {
      isRunning = false;
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      startBtn.innerText = "AVVIA ASSISTENTE";
      statusDiv.innerText = "Sistema Arrestato";
      speak("Assistente arrestato.", true);
    }

    async function detectFrame() {
      if (!isRunning) return;

      const predictions = await model.detect(video);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let primaryAlert = null;
      let highestScore = 0;

      predictions.forEach(prediction => {
        if (prediction.score > 0.5) {
          const [x, y, width, height] = prediction.bbox;

          // Disegna riquadro a schermo
          ctx.strokeStyle = '#00FFFF';
          ctx.lineWidth = 4;
          ctx.strokeRect(x, y, width, height);

          // Calcola direzione orizzontale e superficie occupata
          const centerX = x + width / 2;
          const frameWidth = canvas.width;
          const frameHeight = canvas.height;
          const areaRatio = (width * height) / (frameWidth * frameHeight);

          let direction = "";
          const relX = centerX / frameWidth;
          if (relX < 0.35) {
            direction = "alla tua sinistra, ore 10";
          } else if (relX > 0.65) {
            direction = "alla tua destra, ore 2";
          } else {
            direction = "di fronte a te, ore 12";
          }

          let proximity = "";
          let isCritical = false;
          if (areaRatio > 0.22) {
            proximity = "molto vicino";
            isCritical = true;
          } else if (areaRatio > 0.07) {
            proximity = "a media distanza";
          } else {
            proximity = "in lontananza";
          }

          const rawLabel = prediction.class;
          const labelIt = labelTranslations[rawLabel] || rawLabel;

          if (prediction.score > highestScore) {
            highestScore = prediction.score;
            primaryAlert = {
              label: labelIt,
              direction: direction,
              proximity: proximity,
              isCritical: isCritical
            };
          }
        }
      });

      // Gestione messaggi vocali e vibrazioni
      const now = Date.now();
      if (primaryAlert) {
        const alertKey = `${primaryAlert.label}-${primaryAlert.direction}-${primaryAlert.proximity}`;

        if (primaryAlert.isCritical) {
          triggerVibration([200, 100, 200]); // Vibrazione d'allerta
          if (now - lastAnnouncedTime > 1500 || lastAnnouncedObject !== alertKey) {
            speak(`Attenzione! ${primaryAlert.label} ${primaryAlert.proximity}, ${primaryAlert.direction}.`, true);
            lastAnnouncedObject = alertKey;
            lastAnnouncedTime = now;
          }
        } else if (now - lastAnnouncedTime > ANNOUNCE_COOLDOWN || lastAnnouncedObject !== alertKey) {
          triggerVibration([80]); // Vibrazione breve di conferma
          speak(`${primaryAlert.label}, ${primaryAlert.direction}, ${primaryAlert.proximity}.`);
          lastAnnouncedObject = alertKey;
          lastAnnouncedTime = now;
        }
      }

      if (isRunning) {
        requestAnimationFrame(detectFrame);
      }
    }
  </script>
</body>
</html>
